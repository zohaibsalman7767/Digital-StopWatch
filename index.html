<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>Digital Stopwatch | Zohaib Salman</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="stopwatch-app">
        <header class="header">
            <div class="status">
                <span class="status-dot"></span>
                PRECISION TIMER
            </div>

            <h1>DIGITAL <span>STOPWATCH</span></h1>
            <p class="subtitle">Every second counts.</p>
        </header>

        <section class="stopwatch-card">
            <div class="timer-label">
                <span class="live-dot"></span>
                <span id="timerStatus">READY TO START</span>
            </div>

            <div class="timer-display" id="display" role="timer" aria-label="Elapsed time">
                <span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span><span
                    class="decimal">.</span><span id="milliseconds" class="ms">00</span>
            </div>

            <div class="time-units">
                <span>MINUTES</span>
                <span>SECONDS</span>
                <span>1/100 SEC</span>
            </div>

            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-start">
                    <span>▶</span> START
                </button>

                <button id="lapBtn" class="btn btn-lap" disabled>
                    <span>⚑</span> LAP
                </button>

                <button id="resetBtn" class="btn btn-reset">
                    <span>↻</span> RESET
                </button>
            </div>
        </section>

        <section class="laps-section">
            <div class="laps-heading">
                <h2>LAP RECORDS</h2>
                <span id="lapCount" class="lap-count">0 LAPS</span>
            </div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">◷</div>
                <p>No laps recorded yet</p>
                <span>Start the timer and press LAP.</span>
            </div>

            <div id="lapsList" class="laps-list"></div>
        </section>

        <footer>
            <p>Created By <span>Zohaib Salman</span></p>
            <p class="footer-note">BUILT WITH HTML · CSS · JAVASCRIPT</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
